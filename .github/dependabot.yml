version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 5
    groups:
      next-runtime:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
      testing:
        patterns:
          - vitest
          - "@playwright/test"
      types:
        patterns:
          - typescript
          - "@types/*"
    labels:
      - dependencies
    commit-message:
      prefix: build

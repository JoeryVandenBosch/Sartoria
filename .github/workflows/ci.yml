name: Sartoria validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sartoria-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify production environment contract
        env:
          SARTORIA_AUTH_MODE: better-auth
          SARTORIA_PERSISTENCE_MODE: postgres
          SARTORIA_MEDIA_MODE: production
          SARTORIA_RECOMMENDATION_MODE: fallback
          DATABASE_URL: postgresql://user:password@database.internal:5432/sartoria
          DATABASE_SSL_MODE: require
          BETTER_AUTH_URL: https://sartoria.example.test
          BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef
          MEDIA_S3_BUCKET: sartoria-private-media
          MEDIA_S3_REGION: eu-west-1
          MEDIA_PROCESSING_QUEUE_URL: https://worker.example.test/api/media/process
          MEDIA_PROCESSING_QUEUE_TOKEN: 0123456789abcdef0123456789abcdef
          MEDIA_WORKER_TOKEN: fedcba9876543210fedcba9876543210
          CLAMAV_HOST: clamav.internal
        run: npm run verify:production-env

      - name: Validate staging service definition
        shell: bash
        run: |
          set -euo pipefail
          cp deploy/staging/.env.example deploy/staging/.env
          cp deploy/staging/staging.env.example deploy/staging/staging.env
          docker compose --env-file deploy/staging/.env -f deploy/staging/compose.yml config --quiet
          rm deploy/staging/.env deploy/staging/staging.env

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee validation-lint.log

      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee validation-typecheck.log

      - name: Unit and application tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee validation-tests.log

      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee validation-build.log

      - name: Verify standalone deployment artifact
        run: test -f .next/standalone/server.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke test
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee validation-e2e.log

      - name: Upload validation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics-${{ github.sha }}
          path: validation-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
